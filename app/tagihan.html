<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Tagihan Penyesuaian - Steksa.NET</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

    <div class="card shadow-lg rounded-4 w-100" style="max-width:600px;">
        <div class="card-body p-4">

            <h3 class="fw-bold text-center mb-4">
                Kalkulator Tagihan Penyesuaian
            </h3>

            <div class="mb-3">
                <label class="small mb-1">Nama Pelanggan</label>
                <input type="text" id="nama" class="form-control"
                    placeholder="Nama Pelanggan">
            </div>

            <div class="mb-3">
                <label class="small mb-1">Area Pelanggan</label>
                <input type="text" id="area" class="form-control"
                    placeholder="Area Pelanggan">
            </div>

            <div class="mb-3">
                <label class="small mb-1">Jenis Paket</label>
                <select id="paket" class="form-select">
                    <option value="">--Pilih Paket--</option>
                    <option value="125000">Rp 125.000</option>
                    <option value="150000">Rp 150.000</option>
                    <option value="200000">Rp 200.000</option>
                    <option value="250000">Rp 250.000</option>
                    <option value="300000">Rp 300.000</option>
                    <option value="500000">Rp 500.000</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="small mb-1">Tanggal Pasang</label>
                <input type="date" id="tanggal_pasang" class="form-control">
            </div>

            <div class="mb-3">
                <label class="small mb-1">Jatuh Tempo</label>
                <select id="jatuh_tempo" class="form-select">
                    <option value="">--Pilih Tanggal--</option>
                    <!-- 
                    <option value="1">Tanggal 1</option>
                    <option value="5">Tanggal 5</option>
                    <option value="10">Tanggal 10</option> 
                    -->
                    <option value="15">Tanggal 15</option>
                    <option value="20">Tanggal 20</option>
                    <option value="30">Tanggal 30</option>
                </select>
            </div>

            <div class="d-grid mb-3">
                <button onclick="hitungTagihan()"
                    class="btn btn-warning fw-semibold">
                    Hitung Tagihan
                </button>
            </div>

            <div id="hasil" class="d-none bg-light border rounded-3 p-3 small mb-3"
                style="white-space: pre-line;">
            </div>

            <div class="d-grid">
                <button id="copyBtn"
                    onclick="copyResult()"
                    class="btn btn-success fw-semibold d-none">
                    Salin Hasil
                </button>
            </div>

        </div>
    </div>

</div>

<script>

function formatRupiah(angka) {
    return angka.toLocaleString('id-ID');
}

function formatTanggal(date) {
    return date.toLocaleDateString('id-ID', { 
        day: '2-digit', 
        month: 'long', 
        year: 'numeric' 
    });
}

function hitungTagihan() {

    const nama = document.getElementById("nama").value.trim();
    const area = document.getElementById("area").value.trim();
    const paket = parseInt(document.getElementById("paket").value);
    const tanggalInput = document.getElementById("tanggal_pasang").value;
    const jatuhTempo = parseInt(document.getElementById("jatuh_tempo").value);

    if (!nama || !area || !paket || !tanggalInput || !jatuhTempo) {
        alert("Mohon lengkapi semua data!");
        return;
    }

    const tanggalPasang = new Date(tanggalInput);

    let dueDate = new Date(
        tanggalPasang.getFullYear(),
        tanggalPasang.getMonth(),
        jatuhTempo
    );

    if (tanggalPasang > dueDate) {
        dueDate.setMonth(dueDate.getMonth() + 1);
    }

    tanggalPasang.setHours(0,0,0,0);
    dueDate.setHours(0,0,0,0);

    const selisih = dueDate.getTime() - tanggalPasang.getTime();
    const jumlahHari = Math.round(selisih / (1000 * 60 * 60 * 24)) + 1;

    const tagihanHarian = paket / 30;
    const totalTagihan = Math.round(jumlahHari * tagihanHarian);

    const hasilText =
`Berikut ini kami sampaikan total tagihan penyesuaian Bapak/Ibu pada *STEKSA.NET*.

Nama Pelanggan: *${nama}*
Area: ${area}
Paket Bulanan: Rp. ${formatRupiah(paket)}
Tanggal Pasang: ${formatTanggal(tanggalPasang)}
Jatuh Tempo: ${formatTanggal(dueDate)}
Jumlah Hari Pemakaian: ${jumlahHari} hari
Tagihan Per Hari (Prorata): Rp. ${formatRupiah(Math.round(tagihanHarian))}
Total Penyesuaian: ${jumlahHari} hari x Rp. ${formatRupiah(Math.round(tagihanHarian))}

*Total Tagihan: Rp. ${formatRupiah(totalTagihan)}*

Silahkan lakukan pembayaran sesuai nominal *Total Tagihan* di atas dan kirim bukti transfer untuk proses pengecekan.
Terimakasih.`;

    const hasilDiv = document.getElementById("hasil");
    hasilDiv.classList.remove("d-none");
    hasilDiv.innerText = hasilText;

    document.getElementById("copyBtn").classList.remove("d-none");
}

function copyResult() {
    const text = document.getElementById("hasil").innerText;
    navigator.clipboard.writeText(text);
    alert("Hasil berhasil disalin!");
}

</script>

</body>
</html>
