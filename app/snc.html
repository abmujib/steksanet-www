<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Form Pendaftaran Pelanggan</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="bg-light">

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow-sm border-0 rounded-4">
<div class="card-body p-4">

<h4 class="text-center mb-4 fw-bold">Form Input Data Pelanggan</h4>

<form id="dataForm">

<div class="mb-3">
<label class="form-label">Nama Pelanggan</label>  
<input type="text" class="form-control rounded-3" name="nama" placeholder="Masukkan Nama Lengkap" required>
</div>

<div class="mb-3">
<label class="form-label">Area</label>  
<input type="text" class="form-control rounded-3" name="area" placeholder="Masukkan Area" required>
</div>

<div class="mb-3">
<label class="form-label">Nomor WhatsApp</label>  
<input type="text" class="form-control rounded-3" name="whatsapp" placeholder="Contoh: 628123456789" required>
</div>
  
<div class="mb-3">
<label class="form-label">Upload / Foto KTP</label>  
<input type="file" 
       class="form-control rounded-3" 
       id="ktp" 
       accept="image/*" 
       capture="environment"
       required>
<small class="text-muted">
Klik untuk ambil foto langsung dari kamera belakang atau pilih dari galeri.
</small>
</div>
  
<button type="submit" class="btn btn-primary w-100 rounded-3">
Kirim Data
</button>

</form>

</div>
</div>

</div>
</div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxcZZh7NfMSvmWpsF50sqA0TgWpGJtODW_DAz5IWDwW17CwGLgAsSbVTDoJ8imuM0E-BA/exec";

document.getElementById("dataForm").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const form = e.target;
  const file = document.getElementById("ktp").files[0];
  
  if (!file) {
    Swal.fire("Error!", "Foto KTP wajib diupload!", "error");
    return;
  }

  // Validasi WA format 62
  let wa = form.whatsapp.value.trim();
  if (!wa.startsWith("62")) {
    Swal.fire("Format Salah!", "Nomor WhatsApp harus diawali 62", "warning");
    return;
  }

  Swal.fire({
    title: "Mengirim Data...",
    text: "Mohon tunggu sebentar",
    allowOutsideClick: false,
    didOpen: () => {
      Swal.showLoading();
    }
  });

  const reader = new FileReader();
  reader.onloadend = function() {
    
    const formData = new FormData();
    formData.append("nama", form.nama.value);
    formData.append("area", form.area.value);
    formData.append("whatsapp", wa);
    formData.append("ktp", reader.result);
    
    fetch(scriptURL, {
      method: "POST",
      body: formData
    })
    .then(res => res.text())
    .then(response => {
      
      Swal.fire({
        icon: "success",
        title: "Berhasil!",
        text: "Data berhasil dikirim ke server",
        confirmButtonColor: "#0d6efd"
      });

      form.reset();
    })
    .catch(err => {
      Swal.fire("Gagal!", "Terjadi kesalahan saat mengirim data", "error");
    });
  };
  
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
