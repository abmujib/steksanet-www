<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SNC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            border-radius: 18px;
        }

        .form-control,
        .form-select {
            height: 48px;
            border-radius: 12px;
        }

        .btn-primary {
            height: 50px;
            border-radius: 14px;
            font-weight: 600;
        }

        .select2-container .select2-selection--single {
            height: 48px !important;
            padding: 10px 12px;
            border: 1px solid #ced4da !important;
            border-radius: 12px !important;
        }

        .select2-container {
            width: 100% !important;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <!-- LOGIN -->
                <div class="card shadow border-0" id="loginCard">
                    <div class="card-body p-4">

                        <h4 class="text-center mb-4 fw-bold">Login Teknisi</h4>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>

                            <button type="submit" id="loginBtn" class="btn btn-primary w-100">
                                Login
                            </button>
                        </form>

                    </div>
                </div>

                <!-- FORM -->
                <div class="card shadow border-0 d-none" id="formCard">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold m-0">Form Input Data Pelanggan</h4>
                            <button onclick="logout()" class="btn btn-sm btn-danger">Logout</button>
                        </div>

                        <form id="dataForm">

                            <div class="mb-3">
                                <label class="form-label">Nama Pelanggan</label>
                                <input type="text" class="form-control" name="nama" placeholder="Nama Pelanggan" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nomor WhatsApp</label>
                                <input type="text" class="form-control" name="whatsapp" placeholder="62xxx" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Area</label>
                                <select class="form-select select2Area" name="area" required></select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Desa</label>
                                <select class="form-select select2Desa" name="desa" required>
                                    <option></option>
                                    <option value="pbr">PABUARAN</option>
                                    <option value="cwl">CIWALAT</option>
                                    <option value="snr">SIRNASARI</option>
                                    <option value="bts">BANTARSARI</option>
                                    <option value="skj">SUKAJAYA</option>
                                    <option value="cbd">CIBADAK</option>
                                    <option value="lbs">LEMBURSAWAH</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Upload / Foto KTP</label>
                                <input type="file" class="form-control" id="ktp" accept="image/*" capture="environment" required>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                                Kirim Data
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbzAdKHmfWDtiOF0EqwuN-FOXKRI30B49doEr9-tqe4Gqsz6Bu6tz4B6eklY3Xi4R9hIeQ/exec";
        let token = localStorage.getItem("token");

        $(document).ready(function() {

            if (token) {
                showForm();
            }

            $.getJSON('area.json', function(data) {
                $('.select2Area').select2({
                    placeholder: "Pilih Area",
                    allowClear: true,
                    data: data.results,
                    width: '100%'
                }).val(null).trigger('change');
            });

            $('.select2Desa').select2({
                placeholder: "Pilih Desa",
                allowClear: true,
                width: '100%'
            }).val(null).trigger('change');

        });

        /* ================= LOGIN ================= */

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            Swal.fire({
                title: "Login...",
                text: "Memverifikasi akun",
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => Swal.showLoading()
            });

            const formData = new FormData(this);
            formData.append("action", "login");

            fetch(scriptURL, {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(response => {

                    btn.disabled = false;
                    btn.innerText = "Login";

                    if (response.status === "success") {
                        localStorage.setItem("token", response.token);
                        token = response.token;
                        Swal.close();
                        showForm();
                    } else {
                        Swal.fire("Login Gagal", response.message, "error");
                    }

                })
                .catch(() => {
                    btn.disabled = false;
                    btn.innerText = "Login";
                    Swal.fire("Error", "Tidak bisa koneksi ke server", "error");
                });
        });

        /* ================= SUBMIT DATA ================= */

        document.getElementById("dataForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const form = e.target;
            const btn = document.getElementById("submitBtn");
            const file = document.getElementById("ktp").files[0];

            if (!file) {
                Swal.fire("Error!", "Foto KTP wajib diupload!", "error");
                return;
            }

            let wa = form.whatsapp.value.trim();
            if (!wa.startsWith("62")) {
                Swal.fire("Format Salah!", "Nomor WhatsApp harus diawali 62", "warning");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Mengirim...";

            Swal.fire({
                title: "Memproses Data...",
                html: "Upload KTP & Membuat PPPoE<br><br><b>Mohon tunggu</b>",
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => Swal.showLoading()
            });

            const reader = new FileReader();

            reader.onloadend = function() {

                const formData = new FormData(form);
                formData.set("whatsapp", wa);
                formData.set("ktp", reader.result);
                formData.append("token", token);

                fetch(scriptURL, {
                        method: "POST",
                        body: formData
                    })
                    .then(res => res.json())
                    .then(response => {

                        btn.disabled = false;
                        btn.innerText = "Kirim Data";

                        if (response.status === "success") {

                            Swal.fire({
                                icon: "success",
                                title: "Berhasil!",
                                html: `
<b>Secret PPPoE:</b><br><br>

<div id="secretBox" style="
background:#eef4ff;
border:2px dashed #0d6efd;
padding:12px;
border-radius:10px;
font-weight:bold;
color:#0d6efd;
word-break:break-all;
text-align:center;
margin-bottom:15px;">
${response.secret}
</div>

<button id="copySecretBtn" style="
background:#0d6efd;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;">
Salin Secret
</button>
`,
                                confirmButtonColor: "#198754",
                                didOpen: () => {

                                    const copyBtn = document.getElementById("copySecretBtn");
                                    const secretText = document.getElementById("secretBox").innerText;

                                    copyBtn.addEventListener("click", function() {
                                        navigator.clipboard.writeText(secretText).then(() => {
                                            copyBtn.innerText = "Berhasil Disalin!";
                                            copyBtn.style.background = "#198754";
                                        });
                                    });

                                }
                            });

                            form.reset();
                            $('.select2Area').val(null).trigger('change');

                        } else {
                            Swal.fire("Gagal!", response.message, "error");
                        }

                    })
                    .catch(() => {
                        btn.disabled = false;
                        btn.innerText = "Kirim Data";
                        Swal.fire("Gagal!", "Terjadi kesalahan saat mengirim data", "error");
                    });

            };

            reader.readAsDataURL(file);

        });

        /* ================= UTIL ================= */

        function showForm() {
            document.getElementById("loginCard").classList.add("d-none");
            document.getElementById("formCard").classList.remove("d-none");
        }

        function logout() {
            localStorage.removeItem("token");
            location.reload();
        }
    </script>

</body>

</html>
